<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wutong Lane Loft</title>
<meta name="description" content="A 360° three.js loft with three switchable styles, English and Chinese text, and a live-synthesized city-pop soundtrack.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=ZCOOL+XiaoWei&family=ZCOOL+QingKe+HuangYou&family=Monoton&display=swap">
<style>
/* Layout: full-bleed turntable stage; thin-type name top-left on the sky, one quiet control panel bottom-left */
:root{
  --bg:#e4e4e1;
  --panel:rgba(246,246,244,.8);
  --panel-solid:#f6f6f4;
  --ink:#1b1b1b;
  --muted:#6d6d6a;
  --line:rgba(0,0,0,.1);
  --track:rgba(0,0,0,.16);
  --wash:rgba(0,0,0,.045);
  --sky-ink:#f7f7f5;
  --sky-ink-soft:rgba(247,247,245,.76);
  --sky-shadow:rgba(10,12,16,.25);
  --sky-ink-inv:#1b1b1b;
  --scrim:rgba(12,14,20,.42);
  --accent:#1b1b1b;
  --accent-warm:#94652a;
  --accent-neon:#d6337a;
  --f-neon:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif;
  --eyebrow:#6d6d6a;
  --radius:4px;
  --f-warm:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --f-display:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121314;--panel:rgba(22,22,23,.8);--panel-solid:#1b1b1c;--ink:#ececea;--muted:#9a9a97;
    --line:rgba(255,255,255,.1);--track:rgba(255,255,255,.2);--wash:rgba(255,255,255,.06);
    --accent:#ececea;--accent-warm:#dfab60;--accent-neon:#ff7ab6;--eyebrow:#9a9a97;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121314;--panel:rgba(22,22,23,.8);--panel-solid:#1b1b1c;--ink:#ececea;--muted:#9a9a97;
  --line:rgba(255,255,255,.1);--track:rgba(255,255,255,.2);--wash:rgba(255,255,255,.06);
  --accent:#ececea;--accent-warm:#dfab60;--accent-neon:#ff7ab6;--eyebrow:#9a9a97;
  color-scheme:dark;
}
#app[data-mood="morning"]{--sky-ink:#22272c;--sky-ink-soft:rgba(34,39,44,.66);--sky-shadow:rgba(255,255,255,.35);--sky-ink-inv:#f7f7f5;--scrim:rgba(250,250,248,.62)}
#app[data-style="warm"]{--accent:var(--accent-warm);--eyebrow:var(--accent-warm);--radius:14px;--f-display:var(--f-warm)}
#app[data-style="warm"] .brand h1{font-weight:400;letter-spacing:.1em}
#app[data-style="warm"] .caption{font-weight:400;letter-spacing:.02em}
#app[data-style="neon"]{--accent:var(--accent-neon);--eyebrow:var(--accent-neon);--radius:10px;--f-display:var(--f-neon)}
#app[data-style="neon"] .brand h1{font-weight:400;letter-spacing:.14em;text-shadow:0 0 18px rgba(255,80,170,.45),0 1px 14px var(--sky-shadow)}
#app[data-style="neon"] .brand h1 .lt{font-family:"Monoton",var(--f-mono);font-size:15px;letter-spacing:.14em;color:#ffb3d6;text-shadow:0 0 8px rgba(255,80,170,.85)}
#app[data-style="neon"] .caption{font-weight:400}
#app[data-lang="en"] .brand h1{letter-spacing:.04em;font-size:clamp(26px,3.2vw,36px)}
#app[data-lang="en"] .caption{letter-spacing:.01em;line-height:1.7}
#app[data-lang="en"] .tab{letter-spacing:.04em}
#app[data-lang="en"] .sty,#app[data-lang="en"] .seg button,#app[data-lang="en"] .music,#app[data-lang="en"] .spin{letter-spacing:.03em}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden;isolation:isolate}

.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;z-index:0}
.sky.on{opacity:1}
.sky-morning{background:linear-gradient(180deg,#c9d1d6 0%,#dfe2e2 48%,#ebeae6 100%)}
.sky-dusk{background:linear-gradient(180deg,#78818d 0%,#a3a3a7 40%,#cbc2bb 74%,#e0d8cf 100%)}
.sky-night{background:radial-gradient(110% 60% at 50% 108%,#232833 0%,rgba(35,40,51,0) 60%),linear-gradient(180deg,#090b0f 0%,#12161c 58%,#1a1e25 100%)}
#app[data-style="warm"] .sky-morning{background:linear-gradient(180deg,#b6cfe1 0%,#dbe6eb 44%,#efe5d6 100%)}
#app[data-style="warm"] .sky-dusk{background:linear-gradient(180deg,#36436c 0%,#76628f 32%,#d4867a 64%,#f1c193 100%)}
#app[data-style="neon"] .sky-morning{background:linear-gradient(180deg,#a9c8f0 0%,#f3d1e4 55%,#fde3cf 100%)}
#app[data-style="neon"] .sky-dusk{background:linear-gradient(180deg,#2b1b5a 0%,#6a2c8a 30%,#e2577e 60%,#ff9e6b 82%,#ffd28a 100%)}
#app[data-style="neon"] .sky-night{background:radial-gradient(120% 55% at 50% 108%,#ff4fa3 0%,rgba(255,79,163,.28) 22%,rgba(74,31,107,0) 58%),linear-gradient(180deg,#05040f 0%,#120a2e 55%,#2a1245 100%)}
#app[data-style="warm"] .sky-night{background:radial-gradient(120% 70% at 50% 105%,#2d2749 0%,rgba(45,39,73,0) 62%),linear-gradient(180deg,#060a16 0%,#0f1830 58%,#1b1b38 100%)}
.stars{position:absolute;inset:0;opacity:.7;
  background-image:
    radial-gradient(1.1px 1.1px at 22px 34px,#fff 50%,transparent 55%),
    radial-gradient(.9px .9px at 141px 82px,rgba(255,255,255,.7) 50%,transparent 55%),
    radial-gradient(1.2px 1.2px at 236px 18px,#fff 50%,transparent 55%),
    radial-gradient(.9px .9px at 92px 152px,rgba(255,255,255,.55) 50%,transparent 55%),
    radial-gradient(1px 1px at 284px 168px,rgba(255,255,255,.8) 50%,transparent 55%);
  background-size:310px 210px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 36%,transparent 70%);
  mask-image:linear-gradient(180deg,#000 0%,#000 36%,transparent 70%)}

#c{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;outline:none;cursor:grab;touch-action:none;transition:opacity .26s ease}
#c.swap{opacity:0}
#c:active{cursor:grabbing}

.ui{position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:24px}
.brand{color:var(--sky-ink);text-shadow:0 1px 14px var(--sky-shadow);transition:color 1.2s ease}
.kicker{margin:0 0 10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--sky-ink-soft)}
.brand h1{margin:0;display:flex;align-items:baseline;gap:18px;font-family:var(--f-display);font-weight:300;font-size:clamp(28px,3.6vw,40px);line-height:1.1;letter-spacing:.34em}
.brand h1 .lt{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.32em;color:var(--sky-ink-soft)}
.spec{margin:14px 0 0;padding-top:12px;border-top:1px solid currentColor;border-top-color:var(--sky-ink-soft);width:fit-content;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--sky-ink-soft);font-variant-numeric:tabular-nums}
.hint{margin:6px 0 0;font-size:11.5px;letter-spacing:.12em;color:var(--sky-ink-soft);transition:opacity .6s ease}
.hint.gone{opacity:0}

.dock{pointer-events:auto;width:min(500px,100%);background:var(--panel);
  -webkit-backdrop-filter:blur(20px) saturate(1.1);backdrop-filter:blur(20px) saturate(1.1);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 14px;transition:border-radius .3s ease;display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--eyebrow);font-variant-numeric:tabular-nums}
.caption{margin:-4px 0 0;font-size:15px;font-weight:300;line-height:1.85;letter-spacing:.04em;color:var(--ink);min-height:3.7em;max-width:32em;text-wrap:pretty;transition:opacity .25s ease}
.caption.fade{opacity:0}
.tabs{display:flex;flex-wrap:wrap;column-gap:20px;row-gap:2px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:13.5px;letter-spacing:.12em;padding:8px 0 9px;margin-bottom:-1px;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;gap:2px}
.seg button{font:inherit;font-size:12.5px;letter-spacing:.1em;line-height:1;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--wash)}
.seg svg{width:14px;height:14px;flex:none}
.spin{font:inherit;font-size:12.5px;letter-spacing:.1em;line-height:1;display:inline-flex;align-items:center;gap:9px;padding:6px 0;border:0;background:transparent;color:var(--muted);cursor:pointer}
.spin .sw{width:28px;height:14px;border-radius:999px;border:1px solid var(--track);position:relative;transition:background .2s,border-color .2s;flex:none}
.spin .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.spin[aria-pressed="true"]{color:var(--ink)}
.spin[aria-pressed="true"] .sw{background:var(--accent);border-color:var(--accent)}
.spin[aria-pressed="true"] .sw::after{transform:translateX(14px);background:var(--panel-solid)}
.toggles{display:flex;align-items:center;gap:20px}
.lang{position:absolute;top:24px;right:max(20px,env(safe-area-inset-right,0px));pointer-events:auto;display:inline-flex;gap:2px;padding:2px;border:1px solid var(--sky-ink-soft);border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lng{font:inherit;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;line-height:1;padding:6px 11px;border:0;border-radius:999px;background:transparent;color:var(--sky-ink-soft);cursor:pointer;transition:background .2s,color .2s}
.lng:hover{color:var(--sky-ink)}
.lng[aria-pressed="true"]{background:var(--sky-ink);color:var(--sky-ink-inv)}
.dock-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.styles{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:calc(var(--radius) * .6)}
.sty{font:inherit;font-size:12px;letter-spacing:.1em;line-height:1;padding:6px 10px;border:0;border-radius:calc(var(--radius) * .45);background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.sty:hover{color:var(--ink)}
.sty[aria-pressed="true"]{background:var(--accent);color:var(--panel-solid)}
.music{font:inherit;font-size:12.5px;letter-spacing:.1em;line-height:1;display:inline-flex;align-items:center;gap:8px;padding:6px 0;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s}
.music:hover,.music[aria-pressed="true"]{color:var(--ink)}
.music:disabled{opacity:.5;cursor:default}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{display:block;width:2px;background:currentColor;border-radius:1px;height:5px}
.eq i:nth-child(2){height:9px}.eq i:nth-child(3){height:6px}.eq i:nth-child(4){height:3px}
.music[aria-pressed="true"] .eq i{animation:eq 1.15s ease-in-out infinite}
.music[aria-pressed="true"] .eq i:nth-child(2){animation-delay:-.4s}
.music[aria-pressed="true"] .eq i:nth-child(3){animation-delay:-.8s}
.music[aria-pressed="true"] .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

.loader{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding-inline:24px;text-align:center;color:var(--sky-ink);font-size:12.5px;letter-spacing:.3em;pointer-events:none;transition:opacity .7s ease}
.loader.done{opacity:0}

@media (max-width:600px){
  .ui{padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand h1{gap:12px;letter-spacing:.26em}
  .lang{top:18px;right:max(16px,env(safe-area-inset-right,0px))}
  .brand h1,.kicker{max-width:calc(100vw - 150px)}
  .spec{font-size:11px;letter-spacing:.03em}
  .ui::before{content:"";position:absolute;inset:0 0 auto;height:190px;background:linear-gradient(180deg,var(--scrim) 0%,var(--scrim) 45%,transparent 100%);pointer-events:none;z-index:-1;transition:background 1.2s ease}
  .dock{padding:14px 16px 10px;gap:10px}
  .caption{font-size:14px;line-height:1.75;min-height:3.5em}
  .tabs{column-gap:15px}
  .tab{font-size:13px;letter-spacing:.06em}
  .seg button{padding:7px 8px;letter-spacing:.04em}
}
@media (prefers-reduced-motion:reduce){
  .sky,.caption,.loader,.brand,.hint{transition:none}
  .music[aria-pressed="true"] .eq i{animation:none}
}
</style>
</head>
<body>
<div id="app" data-mood="dusk" data-style="minimal">
  <div class="sky sky-morning" data-sky="morning"></div>
  <div class="sky sky-dusk on" data-sky="dusk"></div>
  <div class="sky sky-night" data-sky="night"><div class="stars"></div></div>
  <canvas id="c" data-i18n-aria="canvas" aria-label="梧桐里 Loft 的立体模型，可拖动旋转"></canvas>

  <div class="ui">
    <header class="brand">
      <p class="kicker">No.7 Wutong Lane</p>
      <h1><span data-i18n="name">梧桐里</span><span class="lt">LOFT</span></h1>
      <p class="spec" data-i18n="spec">68 m² · 挑高 5.4 m · 3 只暹罗 · 1:50</p>
      <p class="hint" id="hint">拖动旋转 · 滚轮缩放 · 右键平移</p>
    </header>
    <div class="lang" role="group" data-i18n-aria="langGroup" aria-label="语言">
      <button class="lng" data-lang="zh" aria-pressed="true">中文</button>
      <button class="lng" data-lang="en" aria-pressed="false">EN</button>
    </div>

    <section class="dock" id="dock" data-i18n-aria="dock" aria-label="观看方式">
      <div class="dock-top">
        <p class="eyebrow" id="eyebrow">黄昏 17:20 · 全景</p>
        <div class="styles" role="group" data-i18n-aria="styleGroup" aria-label="风格">
          <button class="sty" id="s-minimal" data-style="minimal" data-i18n="minimal" aria-pressed="true">性冷淡</button>
          <button class="sty" id="s-warm" data-style="warm" data-i18n="warm" aria-pressed="false">复古暖调</button>
          <button class="sty" id="s-neon" data-style="neon" data-i18n="neon" aria-pressed="false">城市霓虹</button>
        </div>
      </div>
      <p class="caption" id="caption" aria-live="polite">老厂房改成的家，挑高 5.4 米。楼上睡觉，楼下过日子，三只猫哪里都去。</p>
      <div class="tabs" role="group" data-i18n-aria="viewGroup" aria-label="视角">
        <button class="tab" id="v-all" data-view="all" data-i18n="views.all" aria-pressed="true">全景</button>
        <button class="tab" id="v-living" data-view="living" data-i18n="views.living" aria-pressed="false">客厅</button>
        <button class="tab" id="v-bedroom" data-view="bedroom" data-i18n="views.bedroom" aria-pressed="false">卧室</button>
        <button class="tab" id="v-kitchen" data-view="kitchen" data-i18n="views.kitchen" aria-pressed="false">厨房</button>
        <button class="tab" id="v-stairs" data-view="stairs" data-i18n="views.stairs" aria-pressed="false">楼梯</button>
        <button class="tab" id="v-books" data-view="books" data-i18n="views.books" aria-pressed="false">照片墙</button>
      </div>
      <div class="controls">
        <div class="seg" role="group" data-i18n-aria="moodGroup" aria-label="时间">
          <button id="m-morning" data-mood="morning" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1"/></svg><span data-i18n="moods.morning">清晨</span></button>
          <button id="m-dusk" data-mood="dusk" aria-pressed="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M3.6 11a4.4 4.4 0 0 1 8.8 0M1.5 11h13M5 13.6h6M8 3.2v1.4M3.4 5.4l1 1M12.6 5.4l-1 1"/></svg><span data-i18n="moods.dusk">黄昏</span></button>
          <button id="m-night" data-mood="night" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 10.2A5.4 5.4 0 0 1 5.8 3.4a5.4 5.4 0 1 0 6.8 6.8z"/></svg><span data-i18n="moods.night">夜晚</span></button>
        </div>
        <div class="toggles">
          <button class="music" id="music" aria-pressed="false" data-i18n-title="musicTitle" title="原创的城市流行风配乐，在浏览器里实时合成"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="music-label" data-i18n="music">音乐</span></button>
          <button class="spin" id="spin" aria-pressed="true"><span class="sw" aria-hidden="true"></span><span data-i18n="spin">自动旋转</span></button>
        </div>
      </div>
    </section>
  </div>

  <div class="loader" id="loader" data-i18n="loading">正在搭建</div>
</div>
<script>
/* Language: #zh / #en in the link wins, then the viewer's last choice, then the browser language. */
const I18N={
  zh:{title:'梧桐里 Loft',name:'梧桐里',spec:'68 m² · 挑高 5.4 m · 3 只暹罗 · 1:50',hint:'拖动旋转 · 滚轮缩放 · 右键平移',hintTouch:'单指旋转 · 双指缩放',
    dock:'观看方式',styleGroup:'风格',viewGroup:'视角',moodGroup:'时间',langGroup:'语言',canvas:'梧桐里 Loft 的立体模型，可拖动旋转',
    minimal:'性冷淡',warm:'复古暖调',neon:'城市霓虹',views:{all:'全景',living:'客厅',bedroom:'卧室',kitchen:'厨房',stairs:'楼梯',books:'照片墙'},moods:{morning:'清晨',dusk:'黄昏',night:'夜晚'},
    music:'音乐',musicNA:'浏览器不支持音频',musicFail:'音频没能启动',musicTitle:'原创的城市流行风配乐，在浏览器里实时合成',spin:'自动旋转',
    loading:'正在搭建',loadFail:'3D 场景没能加载，请检查网络后刷新页面。',noWebGL:'这台设备暂时无法显示 3D 场景。',

    cur.hemiSky.copy(a.hemiSky).lerp(b.hemiSky,k);cur.hemiGround.copy(a.hemiGround).lerp(b.hemiGround,k);
    for(const key of NUM)cur[key]=lerp(a[key],b[key],k);

  }

    const tg=c.fromT.clone().lerp(c.toT,k);

  }

    for(const b of breathers)b.m.scale.y=b.b*(1+Math.sin(t*1.7+b.ph)*0.04);

    const cp=root.userData.canopy;cp.rotation.z=Math.sin(t*0.6)*0.01;cp.rotation.x=Math.sin(t*0.45+1)*0.008;
    if(cur.dust>0.01){for(let i=0;i<DN;i++){const s=dSeed[i];dPos[i*3]=dBase[i*3]+Math.sin(t*0.13+s)*0.3;dPos[i*3+1]=dBase[i*3+1]+Math.sin(t*0.09+s*1.3)*0.4;dPos[i*3+2]=dBase[i*3+2]+Math.cos(t*0.11+s)*0.3;}dGeo.attributes.position.needsUpdate=true;}
    steam.forEach((s,i)=>{const p=(t*0.22+i/4)%1;s.position.set(2.25+Math.sin(t*1.3+i)*0.05*p,0.48+p*0.5,0.95+Math.cos(t*0.9+i)*0.04*p);const sc=0.05+p*0.17;s.scale.set(sc,sc,1);s.material.opacity=Math.sin(p*Math.PI)*0.22;});
    falling.forEach(f=>{const p=(t/9+f.ph)%1;f.l.position.set(6.6+f.sx+Math.sin(p*9+f.ph*6)*0.5,4.6-p*4.84,-5.3+f.sz+Math.cos(p*7+f.ph*4)*0.5);f.l.rotation.set(p*14+f.ph,p*9,p*6);});
  }else if(first){for(let i=0;i<DN*3;i++)dPos[i]=dBase[i];dGeo.attributes.position.needsUpdate=true;}
  flameMat.emissiveIntensity=cur.lamp*2.6*(0.86+0.14*Math.sin(t*17.3)*Math.sin(t*7.1));
  for(const f of flames)f.visible=cur.lamp>0.05;
  renderer.render(scene,camera);
  if(first){first=false;loader.classList.add('done');}
  requestAnimationFrame(frame);
}
setSpin(spinPref);
requestAnimationFrame(frame);
})();
</script>
